# ============================================================================
# FOOT - ACO terminal
# Font and colours come from aco-theme (~/.config/aco/theme/foot/theme.ini);
# this file only holds behaviour. New windows pick up theme changes.
# ============================================================================

[main]
include=~/.config/aco/theme/foot/theme.ini
shell=/usr/bin/zsh
pad=10x10

[bell]
urgent=no
notify=no

[cursor]
style=beam
