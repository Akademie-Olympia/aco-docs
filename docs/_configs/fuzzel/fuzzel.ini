# ============================================================================
# FUZZEL - ACO launcher (centred, Spotlight-like search)
# Font, colours and rounding come from aco-theme
# (~/.config/aco/theme/fuzzel/theme.ini); this file only holds behaviour/layout.
# ============================================================================

[main]
include=~/.config/aco/theme/fuzzel/theme.ini
dpi-aware=no
prompt="󰍉   "
placeholder=Suchen …
icon-theme=Adwaita
icons-enabled=yes
match-counter=no
fields=name,generic,comment,categories,keywords,filename
terminal=kitty -e
anchor=center
width=40
lines=7
line-height=34
horizontal-pad=16
vertical-pad=14
inner-pad=10
image-size-ratio=0
layer=overlay
exit-on-keyboard-focus-loss=yes
